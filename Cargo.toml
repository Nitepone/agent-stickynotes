[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/app"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"

# Backtraces and panics still show file and line numbers; skipping full variable
# debug info makes builds and links noticeably faster and the target folder smaller.
[profile.dev]
debug = "line-tables-only"
