[package]
name = "stickynotes-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
rmcp = { version = "3.8.0", features = ["server", "transport-streamable-http-server", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stickynotes-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.8.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
