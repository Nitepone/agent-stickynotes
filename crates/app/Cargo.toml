[package]
name = "stickynotes"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local kanban board for humans and AI agents, with an MCP and REST server"
repository = "https://github.com/Nitepone/agent-stickynotes"
readme = "../../README.md"
keywords = ["kanban", "mcp", "agents", "qt"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cxx = "1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"] }
directories = "6.0.0"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spellbook = "0.4.2"
stickynotes-core = { version = "0.4.0", path = "../core" }
stickynotes-server = { version = "0.4.0", path = "../server" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[build-dependencies]
cxx-qt-build = "=0.10.0"

[dev-dependencies]
tempfile = "3.27.0"

# Compiles the .rc file that embeds the icon into the Windows executable.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
