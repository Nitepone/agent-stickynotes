[package]
name = "stickynotes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cxx = "1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stickynotes-core = { version = "0.1.0", path = "../core" }
stickynotes-server = { version = "0.1.0", path = "../server" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }

[build-dependencies]
cxx-qt-build = "=0.10.0"

[dev-dependencies]
tempfile = "3.27.0"
